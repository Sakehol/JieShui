<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src https://userapi.qiekj.com; base-uri 'none'; form-action 'none'">
<title>接水 · 取证</title>
<link rel="stylesheet" href="capture.css">
</head>
<body>
<div class="wrap">
  <h1>接水 · 取证</h1>
  <div class="sub">一个按钮：开阀 + 记录。什么都不判断，只把原始数据记下来</div>

  <div class="card">
    <label for="devSel">设备</label>
    <select id="devSel"><option value="">加载中…</option></select>
    <div class="row">
      <button id="btnGo" class="go">开始（开阀 + 记录）</button>
      <button id="btnStop" class="ghost" disabled>结束</button>
    </div>
    <div class="row">
      <button id="btnMark" class="ghost">打个标记</button>
      <button id="btnCopy" class="ghost">复制全部</button>
    </div>
    <div class="hint">
      点「开始」→ 等页面出现 <b>已开阀</b> → 走到机器前。<br>
      按机器上某个键的前一刻，先点下面<b>对应颜色的按钮</b>记一笔（这样日志里就知道哪一秒你按了什么）。<br>
      每次按完等 4 秒再按下一个。
    </div>
  </div>

  <div class="card marks-card">
    <div class="live-label">按机器键之前，先点一下它（记时间用）</div>
    <div class="row">
      <button id="mkStart" class="mk">我按了【开始】</button>
      <button id="mkPause" class="mk">我按了【暂停】</button>
    </div>
    <div class="row">
      <button id="mkResume" class="mk">我按了【继续】</button>
      <button id="mkEnd" class="mk">我按了【结算】</button>
    </div>
  </div>

  <div class="card live-card">
    <div class="live-label">现在机器报的是</div>
    <div id="live" class="live">—</div>
    <div id="liveHint" class="live-hint"></div>
  </div>

  <div id="log">等待操作…</div>
</div>

<script src="capture.js"></script>
</body>
</html>
